name: update-flake-lock

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 0 * * 0" # runs weekly on Sunday at 00:00

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup

      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          # Title of PR to be created
          pr-title: "Update flake.lock"
          # Labels to be set on the PR
          pr-labels: |
            dependencies
            automated

      - run: echo Opened pull request ${{ steps.update.outputs.pull-request-number }}.
