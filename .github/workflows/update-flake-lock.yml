name: Update flake.lock

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "33 4 * * 0" # runs weekly on Sunday at 04:33 UTC

jobs:
  lockfile:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix-setup

      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          # Title of PR to be created
          pr-title: "Update flake.lock"
          # Labels to be set on the PR
          pr-labels: |
            dependencies
            automated

      - run: echo Opened pull request ${{ steps.update.outputs.pull-request-number }}.
